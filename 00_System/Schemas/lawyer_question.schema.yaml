$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "lawyer_question.schema.yaml"
title: "Lawyer Question"
type: object
additionalProperties: true
required:
  - question_id
  - importance
  - issue
  - why_it_matters
  - current_evidence
  - ai_preliminary_view
  - question
  - blocked_outputs
  - unblocked_work
  - status
properties:
  question_id: { type: string, pattern: "^Q-[0-9]{4,}$" }
  importance: { type: string, enum: [critical, high, medium] }
  issue: { type: string }
  why_it_matters: { type: string }
  current_evidence:
    type: array
    items: { type: string }
  ai_preliminary_view: { type: string }
  question: { type: string }
  options:
    type: array
    items: { type: string }
  blocked_outputs:
    type: array
    items: { type: string }
  unblocked_work:
    type: array
    items: { type: string }
  status: { type: string, enum: [open, answered, superseded, withdrawn] }
  lawyer_answer: { type: [string, "null"] }
  answered_at: { type: [string, "null"], format: date-time }
  decision_id: { type: [string, "null"] }

