$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "evidence.schema.yaml"
title: "Evidence"
type: object
additionalProperties: true
required:
  - evidence_id
  - file_name
  - relative_path
  - evidence_type
  - summary
  - supports
  - contradicts
  - authenticity_status
  - source_location
  - review_status
properties:
  evidence_id: { type: string, pattern: "^E-[0-9]{4,}$" }
  file_name: { type: string, minLength: 1 }
  relative_path: { type: string, minLength: 1 }
  file_hash_sha256: { type: [string, "null"], pattern: "^[a-fA-F0-9]{64}$" }
  evidence_type: { type: string }
  date: { type: [string, "null"] }
  actors:
    type: array
    items: { type: string }
  summary: { type: string }
  supports:
    type: array
    items: { type: string }
  contradicts:
    type: array
    items: { type: string }
  authenticity_status:
    type: string
    enum: [unreviewed, disputed, partially_verified, verified]
  source_location:
    type: array
    items: { type: string }
  derivative_of: { type: [string, "null"] }
  review_status:
    type: string
    enum: [not_reviewed, ai_reviewed, lawyer_reviewed]

