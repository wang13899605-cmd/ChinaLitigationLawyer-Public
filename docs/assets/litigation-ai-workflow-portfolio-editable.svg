<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">诉讼业务的 AI 协同工作流</title>
  <desc id="desc">以证据链、法源有效性与律师决策门槛为核心控制机制的诉讼业务 AI 协同工作流。</desc>
  <defs>
    <style>
      .cn { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .title { font-size: 64px; font-weight: 650; fill: #20252b; }
      .subtitle { font-size: 29px; font-weight: 400; fill: #4c5560; }
      .stage { font-size: 24px; font-weight: 650; fill: #172a46; }
      .copy { font-size: 17px; font-weight: 400; fill: #374151; }
      .note { font-size: 16px; font-weight: 400; fill: #69717c; }
      .label { font-size: 22px; font-weight: 600; fill: #172a46; }
      .line { fill: none; stroke: #183153; stroke-width: 2.3; }
      .accent-line { fill: none; stroke: #157a79; stroke-width: 2.3; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#183153"/>
    </marker>
    <marker id="teal-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#157a79"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#fbfbfa"/>
  <text x="960" y="92" text-anchor="middle" class="cn title">诉讼业务的 AI 协同工作流</text>
  <line x1="128" y1="145" x2="500" y2="145" stroke="#9aa1aa"/>
  <line x1="1420" y1="145" x2="1792" y2="145" stroke="#9aa1aa"/>
  <text x="960" y="154" text-anchor="middle" class="cn subtitle">以证据链、法源有效性与律师决策门槛为核心控制机制</text>

  <!-- Main flow -->
  <g transform="translate(44 210)">
    <rect width="324" height="300" fill="#ffffff" stroke="#aeb5bd"/>
    <circle cx="54" cy="50" r="27" fill="#183153"/>
    <text x="54" y="59" text-anchor="middle" class="cn" font-size="20" font-weight="700" fill="#fff">01</text>
    <text x="96" y="60" class="cn stage">案件接收与指令识别</text>
    <path d="M122 124 h80 l20 20 v76 h-100 z M202 124 v22 h20" class="line"/>
