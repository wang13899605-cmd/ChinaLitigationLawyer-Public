    <line x1="24" y1="244" x2="300" y2="244" stroke="#9aa1aa"/>
    <text x="162" y="271" text-anchor="middle" class="cn copy">Matter 建档｜代理权限</text>
    <text x="162" y="296" text-anchor="middle" class="cn copy">程序阶段｜期限基准</text>
  </g>
  <path d="M368 360 H402" class="line" marker-end="url(#arrow)"/>

  <g transform="translate(402 210)">
